name: Microservices CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python
        run: python --version

      - name: Test
        run: |
          python -c "assert 2 + 2 == 4"
          echo "Tests passed"

      - name: Build
        run: echo "Build stage completed"
